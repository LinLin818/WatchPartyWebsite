<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="room-header">
    <div class="join-room">
    <h2>Join a Room</h2>
    <input id="room" placeholder="Enter room name">
    <button id="join">Join Room</button>
</div>
</header>

<main class="room-layout">

<section class="video-section">
    <div class="section-heading">
        <div>
    <h2>Being Broadcasted</h2>
    <div id="player"></div>
    <p id="now-playing">Nothing playing</p>
        </div>
        
    </div>

     <div class="video-actions">
    <input id="video-url" placeholder="Paste a YouTube link">
    <button id="play-now">Play Now</button>
    <button id="add-video">Add to Queue</button>
    <button id="skip">Next Video</button>

    </div>

    <div class="queue-section">
    <h3>Up Next</h3>
    <ul id="queue"></ul>
    </div>
    </section>

    <aside class="chat-sidebar">
        <div class="chat-header">
            <h2>Chat</h2>
        </div>
        <ul id="messages"></ul>
    <div class="chat-input-container">
    <input id="message" placeholder="Join a room to chat" disabled>
    <button id="send" disabled>Send Message</button>
    </div>
    </aside>
</main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="client.js"></script>
</body>
</html>
